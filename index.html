<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Bibliothèque Kouankam</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Concept: la bibliothèque comme plan de meuble. Cases étiquetées A1…F15 comme sur les étagères, liste de livres dans l'ordre des dos, de gauche à droite. */
:root{
  --bg:#F1F4F2; --surface:#FFFFFF; --ink:#14201C; --muted:#586861; --line:#D3DBD7;
  --accent:#1B6E5A; --accent-soft:#E2EFEA; --on-accent:#FFFFFF; --wood:#A06E3A;
  --ok:#1B6E5A; --warn:#9A6A12; --bad:#B3402B;
  --h0:#F7F9F8; --h1:#E3EEEA; --h2:#C2DDD3; --h3:#7DB6A3; --h4:#3F8F78;
  --h3-fg:#0F2A22; --h4-fg:#FFFFFF; --focus:#1B6E5A;
  --f-display:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;
  --f-body:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1512; --surface:#16201C; --ink:#E6EEEA; --muted:#93A59D; --line:#293631;
  --accent:#4CC3A0; --accent-soft:#1B2E28; --on-accent:#0B1512; --wood:#C99259;
  --ok:#4CC3A0; --warn:#E0B24F; --bad:#EE8268;
  --h0:#121A17; --h1:#1B2E28; --h2:#245041; --h3:#2F7562; --h4:#4CC3A0;
  --h3-fg:#EAF7F2; --h4-fg:#0B1512; --focus:#4CC3A0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1512; --surface:#16201C; --ink:#E6EEEA; --muted:#93A59D; --line:#293631;
  --accent:#4CC3A0; --accent-soft:#1B2E28; --on-accent:#0B1512; --wood:#C99259;
  --ok:#4CC3A0; --warn:#E0B24F; --bad:#EE8268;
  --h0:#121A17; --h1:#1B2E28; --h2:#245041; --h3:#2F7562; --h4:#4CC3A0;
  --h3-fg:#EAF7F2; --h4-fg:#0B1512; --focus:#4CC3A0; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);padding-inline:16px;padding-block:0 48px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:1280px;margin-inline:auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 12px;display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;border-bottom:1px solid var(--line);margin-inline:-16px;padding-inline:16px}
.brand{font:800 22px/1 var(--f-display);letter-spacing:-.01em;margin:0;cursor:pointer;background:none;border:0;padding:0;text-align:left}
.brand small{display:block;font:500 11px/1.4 var(--f-mono);color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-top:4px}
.search{flex:1 1 280px;min-width:0;position:relative}
.search input{width:100%;min-width:0;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 38px 10px 12px}
.search input::-webkit-search-cancel-button{display:none}
.search input::placeholder{color:var(--muted)}
.search button{position:absolute;right:4px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--muted);padding:6px 8px;font-size:18px;line-height:1}
.search button[hidden]{display:none}
main{padding-block:20px}
h2{font:800 28px/1.1 var(--f-display);letter-spacing:-.015em;margin:0 0 4px;text-wrap:balance}
.lede{color:var(--muted);margin:0 0 20px;max-width:62ch}

/* accueil : cartes des pièces */
.rooms{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px}
.room-card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px;text-align:left;display:flex;flex-direction:column;gap:14px;min-width:0;transition:border-color .15s}
.room-card:hover{border-color:var(--accent)}
.room-card h3{font:800 24px/1.1 var(--f-display);margin:0}
.room-card .meta{font:500 12px/1.4 var(--f-mono);color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.mini{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap}
.mini .w{display:grid;gap:2px;border:2px solid var(--wood);border-radius:3px;padding:3px;background:var(--bg)}
.mini i{display:block;width:100%;aspect-ratio:1;border-radius:1px}
.go{font:600 14px/1 var(--f-body);color:var(--accent)}

/* pièce */
.crumbs{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:8px 14px;font-weight:500}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:24px}
@media (min-width:1080px){.layout{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);align-items:start}
  .listcol{position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px);max-height:calc(100vh - 110px);display:flex;flex-direction:column}
  .listcol .scroll{overflow:auto;min-height:0}}
.walls{display:flex;flex-direction:column;gap:20px;min-width:0}
.wall{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;min-width:0}
.wall-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.wall-h h3{font:800 18px/1.2 var(--f-display);margin:0}
.wall-h span{font:500 12px/1 var(--f-mono);color:var(--muted)}
.mapscroll{overflow-x:auto;padding-bottom:4px}
.frame{border:3px solid var(--wood);border-radius:4px;padding:4px;background:var(--bg);display:grid;gap:3px;min-width:max-content}
.lbl{font:500 11px/1 var(--f-mono);color:var(--muted);display:flex;align-items:center;justify-content:center;border:0;background:none;padding:0;min-height:20px;border-radius:3px}
button.lbl:hover{background:var(--accent-soft);color:var(--accent)}
button.lbl[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.cell{height:38px;min-width:36px;border:1px solid transparent;border-radius:3px;font:500 12px/1 var(--f-mono);display:flex;align-items:center;justify-content:center;padding:0;position:relative;font-variant-numeric:tabular-nums}
.cell.c0{background:var(--h0);color:var(--muted);border:1px dashed var(--line);cursor:default}
.cell.c1{background:var(--h1)}.cell.c2{background:var(--h2)}
.cell.c3{background:var(--h3);color:var(--h3-fg)}.cell.c4{background:var(--h4);color:var(--h4-fg)}
.cell:not(.c0):hover{border-color:var(--ink)}
.cell[aria-pressed="true"],.cell.in-sel{box-shadow:inset 0 0 0 2px var(--ink)}
.cell[aria-pressed="true"]{border-color:var(--bg);box-shadow:0 0 0 2px var(--ink)}
.cell .id{position:absolute;top:2px;left:3px;font-size:8px;opacity:.65}
.strip{height:34px;grid-column:1/-1;margin-top:6px;justify-content:flex-start;padding-left:12px}
.gapcol{width:14px}
.legend{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font:500 11px/1 var(--f-mono);color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:14px;height:14px;border-radius:2px;vertical-align:middle}

/* liste */
.listcol{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;min-width:0}
.list-h{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap;margin-bottom:10px}
.list-h h3{font:800 20px/1.15 var(--f-display);margin:0}
.list-h p{margin:2px 0 0;color:var(--muted);font-size:13px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 11px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
ul.books{list-style:none;margin:0;padding:0}
.book{border-top:1px solid var(--line)}
.bk-head{width:100%;display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:4px 12px;align-items:start;text-align:left;background:none;border:0;padding:10px 4px}
.bk-head:hover{background:var(--accent-soft)}
.dot{width:10px;height:10px;border-radius:50%;margin-top:6px;background:var(--bad)}
.q2 .dot{background:var(--ok)}.q1 .dot{background:var(--warn)}
.bk-title{font-weight:600;overflow-wrap:anywhere}
.bk-author{display:block;color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.bk-loc{font:500 12px/1.6 var(--f-mono);color:var(--muted);white-space:nowrap}
.bk-detail{padding:2px 4px 14px 26px;font-size:13px;display:grid;gap:4px}
.bk-detail dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 12px}
.bk-detail dt{color:var(--muted)}.bk-detail dd{margin:0;overflow-wrap:anywhere}
.bk-detail a{color:var(--accent);font-weight:600}
.bk-detail .go2{justify-self:start;margin-top:6px;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:6px 10px;font-size:13px}
.note{color:var(--muted);font-size:13px}
.more{display:block;margin:12px auto 0;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:8px 16px}
.empty{padding:28px 8px;text-align:center;color:var(--muted)}
.keyq{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
.keyq span{display:inline-flex;gap:6px;align-items:center}.keyq .dot{margin:0}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
<header class="top">
  <button class="brand" id="home" type="button">Bibliothèque Kouankam<small id="tally"></small></button>
  <div class="search">

    <button id="clr" type="button" aria-label="Effacer la recherche" hidden>×</button>
  </div>
</header>
<main id="app"></main>
</div>

2 80 6 0 oo Ge TO RR KR Rk RY","a":"OX RN","q":0,"n":1},{"w":"ch","c":"NC","t":"SOUS LE TITRE DIX PETITS NÈGRES","a":"PRÉCÉDEMMENT PUBLIÉ","q":0,"n":1},{"w":"ch","c":"NC","t":"Sh te","a":"","q":0,"n":1},{"w":"ch","c":"NC","t":"LIN AT ca, Fi","a":"","q":0,"n":1},{"w":"ch","c":"NC","t":"Ree HS ee eee","a":"","q":0,"n":1},{"w":"ch","c":"NC","t":"ere oa ’s \"a oe e's se ee ee oa 8 Se ee","a":"","q":0,"n":1},{"w":"ch","c":"NC","t":"ref 5 ou uf gry Pod Ry USING","a":"S3WIL AYOA MIN","q":0,"n":1},{"w":"ch","c":"NC","t":"Trúc Lâm tông chỉ nguyên thanh trong Văn học Phật giáo Việt Nam","a":"Hạnh Tuệ","q":2,"n":1,"y":"2018","p":"Nhà xuất bản Khoa học Xã hội, Thaihabooks","s":"Trúc Lâm (Sect); Zen Buddhism -- History -- Vietnam; Buddhist literature -- History and criticism -- Vietnam; Buddhism -- History -- Vietnam; Buddhism","u":"https://id.lib.harvard.edu/alma/99153733618703941/catalog","src":"HOLLIS (local)"},{"w":"ch","c":"NC","t":"23e Il Guomps HI9QNOBIJA UUEX sp UONONPEIT","a":"XNOJU9SA JOS np","q":0,"n":1},{"w":"ch","c":"NC","t":"eT ae een ke an mn","a":"","q":0,"n":1},{"w":"ch","c":"NC","t":"Shea Se enue","a":"","q":0,"n":1},{"w":"ch","c":"NC","t":"FiNEW YORK TIMES B ESTSELLER TA-NEHISI","a":"","q":0,"n":1},{"w":"ch","c":"NC","t":"NALOW AH Le qustorisy Bupzeas “Pred J","a":"Ann 8 ‘puyut Au 0","q":0,"n":1},{"w":"ch","c":"NC","t":"Christian Destremau les vies secretes du créateur de James Bond","a":"","q":0,"n":1},{"w":"ch","c":"NC","t":"related the broad history of Indian slavery in the Americas SAN FRANCISCO CHRONFOPS","a":"of Indian Enslavement","q":0,"n":1},{"w":"ch","c":"NC","t":"RARE ASE AS CRETE. BL","a":"","q":0,"n":1},{"w":"ch","c":"NC","t":"Cambridge social and cultural histories.","a":"","q":2,"n":1,"y":"2003","p":"Cambridge University Press","u":"https://id.lib.harvard.edu/alma/990092267680203941/catalog","src":"HOLLIS (local)"},{"w":"ch","c":"NC","t":"hasta nn lll ER nen natal an","a":"","q":0,"n":1},{"w":"ch","c":"NC","t":"het en La Découverte HISTOIRE-MONDE","a":"","q":0,"n":1}];
const WALLS={
  bd:{room:'bureau',name:'Bureau droite',rows:'ABCDEF',cols:15,extra:{key:'EnBas',label:'En bas'}},
  bg:{room:'bureau',name:'Bureau gauche',rows:'ABCDEFGH',cols:9,gap:7},
  ch:{room:'chambre',name:'Chambre',rows:'ABCDEFG',cols:6,extra:{key:'NC',label:'Non classé'}}
};
const ROOMS={bureau:{name:'Bureau',walls:['bd','bg']},chambre:{name:'Chambre',walls:['ch']}};
const QL=['Texte OCR brut, à vérifier','Titre identifié par moi','Trouvé dans un catalogue'];
const fold=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const plural=(n,a,b)=>n+' '+(n>1?b:a);
for(const b of BOOKS){
  const m=/^([A-Z])(\d+)$/.exec(b.c);
  b.r=m?m[1]:null; b.col=m?+m[2]:null; b.sp=m?null:b.c;
  b.k=fold([b.t,b.a,b.p,b.s,b.i,b.y].join(' | '));
}
const S={room:null,sel:null,filter:-2,query:'',limit:150,open:null};
const $=(t,props,...kids)=>{const e=document.createElement(t);
  if(props)for(const[k,v]of Object.entries(props)){
    if(k==='class')e.className=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);
    else if(k==='style')e.style.cssText=v;else if(v===true)e.setAttribute(k,'');else if(v!==false&&v!=null)e.setAttribute(k,v)}
  for(const c of kids.flat())if(c!=null)e.append(c.nodeType?c:document.createTextNode(c));return e};
const inSel=(b,sel)=>b.w===sel.w&&(sel.sp?b.sp===sel.sp:(!sel.r||b.r===sel.r)&&(!sel.col||b.col===sel.col)&&!b.sp);
const count=(w,pred)=>BOOKS.reduce((n,b)=>n+(b.w===w&&pred(b)?1:0),0);
const MAX=Math.max(...BOOKS.reduce((m,b)=>(m[b.w+b.c]=(m[b.w+b.c]||0)+1,m),{}) && Object.values(BOOKS.reduce((m,b)=>(m[b.w+b.c]=(m[b.w+b.c]||0)+1,m),{})));
const lvl=n=>!n?0:Math.min(4,1+Math.floor(n/MAX*4-0.0001));
const cellCounts=w=>{const m={};for(const b of BOOKS)if(b.w===w)m[b.c]=(m[b.c]||0)+1;return m};
const roomTotal=r=>ROOMS[r].walls.reduce((n,w)=>n+count(w,()=>true),0);
const place=b=>WALLS[b.w].name+' · '+(b.sp?(b.sp==='EnBas'?'en bas':'non classé'):b.c);

function go(room,sel){S.room=room;S.sel=sel||null;S.filter=-2;S.limit=150;S.open=null;S.query='';q.value='';clr.hidden=true;render()}

/* ---------- accueil ---------- */
function mini(w){const W=WALLS[w],cc=cellCounts(w);
  const g=$('div',{class:'w',style:`grid-template-columns:repeat(${W.cols},9px)`});
  for(const r of W.rows)for(let c=1;c<=W.cols;c++){const n=cc[r+c]||0;g.append($('i',{style:`background:var(--h${lvl(n)})${n?'':';opacity:.6'}`}))}
  return g}
function home(){
  const app=$('div');
  app.append($('h2',null,'Choisis une pièce'),
    $('p',{class:'lede'},`${plural(BOOKS.length,'livre','livres')} rangés dans ${Object.keys(WALLS).length} murs de rayonnages. Ouvre une pièce, clique une case du meuble, et la liste des livres s'affiche dans l'ordre des dos.`));
  const wrap=$('div',{class:'rooms'});
  for(const[k,R]of Object.entries(ROOMS)){
    const t=roomTotal(k),cat=R.walls.reduce((n,w)=>n+count(w,b=>b.q===2),0);
    wrap.append($('button',{class:'room-card',type:'button',onclick:()=>go(k)},
      $('div',{class:'meta'},R.walls.length>1?'2 murs':'1 mur'),
      $('h3',null,R.name),
      $('div',{class:'mini'},R.walls.map(mini)),
      $('div',null,$('strong',null,plural(t,'livre','livres')),$('div',{class:'note'},`${cat} retrouvés dans un catalogue`)),
      $('span',{class:'go'},'Ouvrir la pièce →')));
  }
  app.append(wrap);return app}

/* ---------- pièce ---------- */
function wallPanel(w){
  const W=WALLS[w],cc=cellCounts(w),sel=S.sel&&S.sel.w===w?S.sel:null;
  const cols=W.gap?`26px repeat(${W.gap},minmax(36px,1fr)) 14px repeat(${W.cols-W.gap},minmax(36px,1fr))`:`26px repeat(${W.cols},minmax(36px,1fr))`;
  const f=$('div',{class:'frame',style:`grid-template-columns:${cols}`});
  f.append($('span'));
  for(let c=1;c<=W.cols;c++){
    if(W.gap&&c===W.gap+1)f.append($('span',{class:'gapcol'}));
    f.append($('button',{class:'lbl',type:'button','aria-label':'Colonne '+c,'aria-pressed':!!(sel&&sel.col===c&&!sel.r),onclick:()=>pick({w,col:c})},c));
  }
  for(const r of W.rows){
    f.append($('button',{class:'lbl',type:'button','aria-label':'Étagère '+r,'aria-pressed':!!(sel&&sel.r===r&&!sel.col),onclick:()=>pick({w,r})},r));
    for(let c=1;c<=W.cols;c++){
      if(W.gap&&c===W.gap+1)f.append($('span',{class:'gapcol'}));
      const id=r+c,n=cc[id]||0;
      const on=sel&&!sel.sp&&((sel.r===r&&sel.col===c)||(sel.r===r&&!sel.col)||(sel.col===c&&!sel.r));
      f.append(n?$('button',{class:`cell c${lvl(n)}${on?' in-sel':''}`,type:'button','aria-label':`Case ${id}, ${plural(n,'livre','livres')}`,'aria-pressed':!!(sel&&sel.r===r&&sel.col===c),onclick:()=>pick({w,r,col:c})},n)
        :$('span',{class:'cell c0','aria-hidden':'true'},'·'));
    }
  }
  if(W.extra){const n=cc[W.extra.key]||0;
    f.append($('button',{class:`cell strip c${lvl(n)}`,type:'button',disabled:!n,'aria-pressed':!!(sel&&sel.sp),onclick:()=>pick({w,sp:W.extra.key})},W.extra.label+' · '+n))}
  const tot=count(w,()=>true);
  return $('section',{class:'wall'},
    $('div',{class:'wall-h'},$('h3',null,W.name),$('span',null,`${plural(tot,'livre','livres')} · ${W.rows[0]}–${W.rows.at(-1)} × 1–${W.cols}`)),
    $('div',{class:'mapscroll'},f),
    $('div',{class:'legend'},'Livres par case',[0,1,2,3,4].map(i=>$('i',{style:`background:var(--h${i});${i?'':'border:1px dashed var(--line)'}`})),'peu → beaucoup'));
}
function pick(sel){const same=S.sel&&JSON.stringify(S.sel)===JSON.stringify(sel);
  S.sel=same?null:sel;S.filter=-2;S.limit=150;S.open=null;render();
  if(S.sel&&matchMedia('(max-width:1079px)').matches)document.getElementById('list')?.scrollIntoView({behavior:'smooth',block:'start'})}

function roomView(){
  const R=ROOMS[S.room],app=$('div');
  const seg=$('div',{class:'seg',role:'group','aria-label':'Pièce'});
  for(const[k,v]of Object.entries(ROOMS))seg.append($('button',{type:'button','aria-pressed':k===S.room,onclick:()=>go(k)},v.name));
  app.append($('div',{class:'crumbs'},seg,$('span',{class:'note'},plural(roomTotal(S.room),'livre','livres'))));
  const walls=$('div',{class:'walls'},R.walls.map(wallPanel));
  const lc=$('aside',{class:'listcol',id:'list'});
  app.append($('div',{class:'layout'},walls,lc));
  fillList(lc);return app}

function selTitle(){
  if(!S.sel)return['Toute la pièce',ROOMS[S.room].name];
  const s=S.sel,n=WALLS[s.w].name;
  if(s.sp)return[s.sp==='EnBas'?'En bas':'Non classé',n];
  if(s.r&&s.col)return['Case '+s.r+s.col,n];
  if(s.r)return['Étagère '+s.r,n+' · de gauche à droite'];
  return['Colonne '+s.col,n+' · de haut en bas'];}
function matches(){
  const R=ROOMS[S.room];
  let a=BOOKS.filter(b=>S.sel?inSel(b,S.sel):R.walls.includes(b.w));
  if(S.sel&&S.sel.col&&!S.sel.r)a=a.slice().sort((x,y)=>x.r<y.r?-1:x.r>y.r?1:0);
  return a}
function fillList(box){
  box.replaceChildren();
  const all=matches(),[h,sub]=selTitle();
  const items=fq(all);
  box.append($('div',{class:'list-h'},$('div',null,$('h3',null,h),$('p',null,sub+' · '+plural(all.length,'livre','livres')))));
  if(!S.sel)box.append($('p',{class:'note'},'Clique une case, une lettre (étagère) ou un chiffre (colonne) sur le meuble pour voir ses livres.'));
  box.append(chips(all,()=>fillList(box)));
  const sc=$('div',{class:'scroll'});box.append(sc);
  sc.append(bookList(items,box,false));
  box.append(quality());
}
const fq=(a,f=S.filter)=>f===-1?a:f===-2?a.filter(b=>b.q>0):a.filter(b=>b.q===f);
function chips(all,again){
  const d=$('div',{class:'chips',role:'group','aria-label':'Filtrer'});
  const opts=[[-2,'Identifiés'],[2,'Catalogués'],[0,'OCR brut'],[-1,'Tous']];
  for(const[v,l]of opts){const n=fq(all,v).length;
    d.append($('button',{class:'chip',type:'button','aria-pressed':S.filter===v,onclick:()=>{S.filter=v;S.limit=150;again()}},`${l} ${n}`))}
  return d}
function quality(){return $('div',{class:'keyq'},[2,1,0].map(i=>$('span',{class:'q'+i},$('i',{class:'dot'}),QL[i])))}
function bookList(items,box,showLoc){
  if(!items.length)return $('div',{class:'empty'},'Aucun livre ici.');
  const ul=$('ul',{class:'books'});
  items.slice(0,S.limit).forEach((b,i)=>ul.append(bookRow(b,i,showLoc)));
  const wrap=$('div',null,ul);
  if(items.length>S.limit)wrap.append($('button',{class:'more',type:'button',onclick:()=>{S.limit+=200;box===null?renderResults():fillList(box)}},`Afficher la suite (${items.length-S.limit} restants)`));
  return wrap}
function bookRow(b,i,showLoc){
  const key=b.w+b.c+'|'+b.t+'|'+b.a;
  const li=$('li',{class:'book q'+b.q});
  const head=$('button',{class:'bk-head',type:'button','aria-expanded':S.open===key,onclick:()=>{S.open=S.open===key?null:key;
    const on=S.open===key;head.setAttribute('aria-expanded',on);det.hidden=!on;}},
    $('i',{class:'dot','aria-hidden':'true'}),
    $('span',null,$('span',{class:'bk-title'},b.t||'(sans titre)'),b.a?$('span',{class:'bk-author'},b.a+(b.y?' · '+b.y:'')):(b.y?$('span',{class:'bk-author'},b.y):null)),
    $('span',{class:'bk-loc'},showLoc?place(b):(b.sp?'':b.c)));
  const dl=$('dl');
  const add=(k,v)=>{if(v){dl.append($('dt',null,k),$('dd',null,v))}};
  add('Statut',QL[b.q]);add('Éditeur',b.p);add('ISBN',b.i);add('Sujet',b.s);add('Source',b.src);
  if(b.n>1)add('Photos',`Vu ${b.n} fois sur les photos`);
  add('Emplacement',place(b));
  const det=$('div',{class:'bk-detail',hidden:S.open!==key},dl,
    b.u?$('a',{href:b.u,target:'_blank',rel:'noopener'},'Ouvrir la notice du catalogue ↗'):null,
    b.q===0?$('span',{class:'note'},'Texte lu par OCR sur la photo, souvent déformé : à confirmer devant l\'étagère.'):null,
    showLoc?$('button',{class:'go2',type:'button',onclick:()=>jump(b)},'Voir la case sur le meuble'):null);
  li.append(head,det);return li}
function jump(b){
  go(WALLS[b.w].room,b.sp?{w:b.w,sp:b.sp}:{w:b.w,r:b.r,col:b.col});
  S.open=b.w+b.c+'|'+b.t+'|'+b.a;render();
  requestAnimationFrame(()=>document.getElementById('list')?.scrollIntoView({behavior:'smooth',block:'start'}))}

/* ---------- recherche ---------- */
function renderResults(){
  const app=document.getElementById('app'),terms=fold(S.query).split(/\s+/).filter(Boolean);
  const all=BOOKS.filter(b=>terms.every(t=>b.k.includes(t)));
  const items=fq(all);
  const box=$('div');
  box.append($('h2',null,all.length?plural(all.length,'résultat','résultats'):'Aucun résultat'),
    $('p',{class:'lede'},all.length?`Pour « ${S.query} ». Ouvre un livre puis « Voir la case » pour aller à son rayonnage.`:`Rien pour « ${S.query} ». Essaie un seul mot, ou le nom de l'auteur.`));
  if(all.length){
    box.append(chips(all,renderResults));
    const l=$('section',{class:'listcol',style:'position:static;max-height:none'});
    l.append(bookList(items,null,true));
    box.append(l,quality());
  }
  app.replaceChildren(box)}

function render(){
  const app=document.getElementById('app');
  if(S.query.trim().length>=2){renderResults();return}
  app.replaceChildren(S.room?roomView():home())}

const q=document.getElementById('q'),clr=document.getElementById('clr');
q.addEventListener('input',()=>{S.query=q.value;clr.hidden=!q.value;S.filter=-2;S.limit=150;S.open=null;render()});
clr.addEventListener('click',()=>{q.value='';S.query='';clr.hidden=true;render();q.focus()});
document.getElementById('home').addEventListener('click',()=>{go(null)});
document.getElementById('tally').textContent=`${BOOKS.length} livres · ${Object.keys(ROOMS).length} pièces`;
render();
</script>
